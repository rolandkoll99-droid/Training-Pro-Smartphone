<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ESV Grein | Steuerung + separates Zuschauer-Fenster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0a2b14;
            min-height: 100vh;
        }
        /* ----- Steuerungs-Ansicht (PC) ----- */
        .control-view {
            max-width: 1400px;
            margin: 0 auto;
            background: #fefcf5;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            min-height: 100vh;
        }
        .top-bar {
            background: white;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid #deecd2;
        }
        h1 { font-size: 1.2rem; background: #eef5e9; padding: 4px 16px; border-radius: 60px; color: #1b4d1b; }
        .settings-group {
            display: flex;
            gap: 12px;
            background: #f6faf3;
            padding: 5px 20px;
            border-radius: 60px;
            flex-wrap: wrap;
        }
        .team-name-input {
            border: 1px solid #c2d6b8;
            border-radius: 30px;
            padding: 5px 10px;
            width: 120px;
            text-align: center;
            font-size: 0.8rem;
        }
        .kehren-select, .apply-btn {
            padding: 5px 12px;
            border-radius: 40px;
            border: 1px solid #bbd4ae;
            background: white;
            font-weight: bold;
            cursor: pointer;
        }
        .apply-btn { background: #2d6a4f; color: white; }
        .speech-toggle { display: flex; align-items: center; gap: 6px; background: #eef3ea; padding: 4px 15px; border-radius: 40px; font-size: 0.75rem; }
        .compact-timer {
            background: #1e2a1e;
            border-radius: 60px;
            padding: 4px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .compact-timer-digits {
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: 800;
            color: #f5ffd3;
            background: #00000030;
            padding: 2px 8px;
            border-radius: 40px;
        }
        .compact-timer-btn {
            background: #eef3ea;
            border: none;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.6rem;
            cursor: pointer;
        }
        .open-spectator-btn {
            background: #1f5e3a;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .dashboard-control {
            display: grid;
            grid-template-columns: 260px 1fr 260px;
            gap: 0;
            background: #fefcf5;
        }
        .input-left, .input-right {
            background: #fafdf8;
            padding: 12px 8px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
        }
        .input-left { border-right: 2px solid #dae9ce; }
        .input-right { border-left: 2px solid #dae9ce; }
        .team-header {
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            background: #eef3ea;
            border-radius: 40px;
            padding: 6px;
            margin-bottom: 12px;
        }
        .kehren-grid-side {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kehre-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 4px 10px;
            border-radius: 40px;
            border: 1px solid #e0ecd6;
        }
        .kehre-row.current-kehre-bg { background: #c8e6c9 !important; border-left: 4px solid #2e7d32; }
        .kehre-row.played-kehre-bg { background: #ffcdd2 !important; border-left: 4px solid #c62828; }
        .kehre-nr { font-weight: 800; width: 42px; font-size: 0.7rem; }
        .punkte-group { display: flex; gap: 4px; align-items: center; }
        .side-punkt {
            min-width: 38px;
            background: white;
            border: 2px solid #cbdfc1;
            border-radius: 30px;
            font-weight: 800;
            cursor: pointer;
            padding: 5px 0;
        }
        .side-value {
            background: #2c7a4d;
            color: white;
            padding: 3px 8px;
            border-radius: 30px;
            min-width: 42px;
            text-align: center;
        }
        .side-del {
            background: #fef1ec;
            border: 1px solid #efcdc2;
            border-radius: 30px;
            width: 34px;
            cursor: pointer;
        }
        .center-control {
            background: white;
            padding: 20px;
        }
        .games-to-win-panel {
            background: #f3f9ef;
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .win-option-btn {
            background: white;
            border: 2px solid #bbd4ae;
            border-radius: 60px;
            padding: 5px 16px;
            font-weight: 800;
            cursor: pointer;
        }
        .win-option-btn.active-win-option { background: #2d6a4f; color: white; }
        .result-mega {
            display: flex;
            gap: 30px;
            margin: 15px 0;
        }
        .result-card {
            flex: 1;
            background: #fafef5;
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e2efda;
        }
        .result-team { font-size: 1.8rem; font-weight: 900; }
        .current-round { font-size: 3.5rem; font-weight: 900; color: #1c691c; background: #ecf7e5; border-radius: 70px; margin: 15px 0; }
        .games-number { font-size: 2rem; font-weight: 800; background: #1b4d1b; color: white; display: inline-block; padding: 4px 20px; border-radius: 50px; }
        .current-kehre-center { text-align: center; background: #eef3e4; border-radius: 60px; padding: 8px 20px; display: inline-block; width: auto; margin-top: 10px; }
        .action-footer {
            background: white;
            border-top: 2px solid #dae8d0;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #f0f5eb;
            border: none;
            padding: 6px 22px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        .action-win { background: #ffdf8c; }
        .action-new { background: #1e5a2e; color: white; }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a472a;
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            z-index: 5000;
            pointer-events: none;
        }
        body.game-finished .side-punkt,
        body.game-finished .side-del { opacity: 0.5; pointer-events: none; }
        @media (max-width: 800px) {
            .dashboard-control { grid-template-columns: 1fr; }
            .input-left, .input-right { max-height: unset; }
        }
    </style>
</head>
<body>
    <!-- STEUERUNGSANSICHT (PC) -->
    <div id="controlView" class="control-view">
        <div class="top-bar">
            <h1>🥌 ESV Grein · Steuerungsmodus 🥌</h1>
            <div class="settings-group">
                <input type="text" id="teamANameSide" class="team-name-input" value="Mannschaft W">
                <span>🆚</span>
                <input type="text" id="teamBNameSide" class="team-name-input" value="Mannschaft E">
                <select id="kehrenSelectSide"><option value="4">4</option><option value="6" selected>6</option><option value="8">8</option><option value="10">10</option><option value="12">12</option></select>
                <button id="applyKehrenSide" class="apply-btn">Übernehmen</button>
                <div class="speech-toggle"><input type="checkbox" id="speechToggleSide" checked><label>🔊 Sprachansage</label></div>
            </div>
            <div class="compact-timer">
                <span class="compact-timer-digits" id="timerDisplayCompact">00:00:00</span>
                <button class="compact-timer-btn" id="timerResetCompactBtn">Reset</button>
                <button class="compact-timer-btn" id="timerPauseCompactBtn">Pause</button>
                <button id="openSpectatorBtn" class="open-spectator-btn">📺 Zuschauer-Monitor öffnen</button>
            </div>
        </div>

        <div class="dashboard-control">
            <div class="input-left">
                <div class="team-header"><span>🥌</span> <span id="leftTeamName">Mannschaft W</span></div>
                <div id="leftKehrenPanel" class="kehren-grid-side"></div>
                <div style="text-align:center; font-size:9px; margin-top:12px;">1-4 Punkte</div>
            </div>

            <div class="center-control">
                <div class="games-to-win-panel">
                    <span>🏆 Zum Gesamtsieg nötig:</span>
                    <button data-target="2" class="win-option-btn active-win-option">2 Siege</button>
                    <button data-target="3" class="win-option-btn">3 Siege</button>
                    <button data-target="4" class="win-option-btn">4 Siege</button>
                    <button data-target="5" class="win-option-btn">5 Siege</button>
                    <button id="autoEvaluateGameBtn" class="apply-btn" style="background:#1f5e3a;">⚡ Spiel automatisch werten</button>
                </div>
                <div class="result-mega">
                    <div class="result-card" style="border-bottom: 6px solid #2c7a4d;">
                        <div class="result-team"><span id="centerTeamA">Mannschaft W</span></div>
                        <div class="current-round" id="centerRoundA">0</div>
                        <div>🏆 GEWONNENE SPIELE 🏆<br><span class="games-number" id="centerGamesA">0</span><span id="stampA" style="margin-left:10px;"></span></div>
                    </div>
                    <div class="result-card" style="border-bottom: 6px solid #c0392b;">
                        <div class="result-team"><span id="centerTeamB">Mannschaft E</span></div>
                        <div class="current-round" id="centerRoundB">0</div>
                        <div>🏆 GEWONNENE SPIELE 🏆<br><span class="games-number" id="centerGamesB">0</span><span id="stampB" style="margin-left:10px;"></span></div>
                    </div>
                </div>
                <div style="text-align:center;">
                    <div class="current-kehre-center">🟢 AKTUELLE KEHRE <strong id="currentKehreDisplay">1</strong></div>
                </div>
                <div id="globalWinnerMsg" style="margin-top: 12px; text-align: center;"></div>
            </div>

            <div class="input-right">
                <div class="team-header"><span id="rightTeamName">Mannschaft E</span> <span>🥌</span></div>
                <div id="rightKehrenPanel" class="kehren-grid-side"></div>
                <div style="text-align:center; font-size:9px; margin-top:12px;">1-4 Punkte</div>
            </div>
        </div>

        <div class="action-footer">
            <button class="action-btn action-win" id="winGameBtn">🏆 Spiel gewinnen</button>
            <button class="action-btn" id="resetRoundBtn">🔄 Runde löschen</button>
            <button class="action-btn action-new" id="newGameBtn">✨ Neues Spiel</button>
            <button class="action-btn" id="resetTotalBtn">🗑️ Gesamtwertung</button>
            <button class="action-btn" id="printPDFBtn">🖨️ Drucken</button>
        </div>
    </div>

    <script>
        // ---------- SPIELSTAND ----------
        let anzahlKehren = 6;
        let teamAPunkte = new Array(6).fill(0);
        let teamBPunkte = new Array(6).fill(0);
        let gamesWonA = 0, gamesWonB = 0;
        let overallWinner = false;
        let teamAName = "Mannschaft W", teamBName = "Mannschaft E";
        let speechEnabled = true;
        let requiredGamesToWin = 2;
        
        // Timer
        let gameStartTime = null, timerInterval = null, timerRunning = true, pausedElapsed = 0;
        const timerDisplayCompact = document.getElementById('timerDisplayCompact');
        
        // DOM Steuerung
        const centerTeamA = document.getElementById('centerTeamA'), centerTeamB = document.getElementById('centerTeamB');
        const centerRoundA = document.getElementById('centerRoundA'), centerRoundB = document.getElementById('centerRoundB');
        const centerGamesA = document.getElementById('centerGamesA'), centerGamesB = document.getElementById('centerGamesB');
        const stampA = document.getElementById('stampA'), stampB = document.getElementById('stampB');
        const currentKehreSpan = document.getElementById('currentKehreDisplay');
        const globalWinnerMsgDiv = document.getElementById('globalWinnerMsg');
        
        // Referenz zum Zuschauer-Fenster (falls offen)
        let spectatorWindow = null;

        const sum = arr => arr.reduce((a,b)=>a+b,0);

        // Timer-Funktionen
        function updateTimerUI() {
            let elapsed = 0;
            if (timerRunning && gameStartTime) elapsed = Date.now() - gameStartTime;
            else if (!timerRunning && pausedElapsed>0) elapsed = pausedElapsed;
            else if (gameStartTime) elapsed = Date.now() - gameStartTime;
            const totalSec = Math.floor(elapsed/1000);
            const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
            const timeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            timerDisplayCompact.innerText = timeStr;
            // Wenn Zuschauer-Fenster offen, Timer dort aktualisieren
            if (spectatorWindow && !spectatorWindow.closed) {
                try {
                    spectatorWindow.updateSpectatorTimer(timeStr);
                } catch(e) {}
            }
        }
        function startTimerInterval() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(updateTimerUI, 200); }
        function initTimer() { gameStartTime = Date.now(); timerRunning = true; pausedElapsed = 0; startTimerInterval(); updateTimerUI(); }
        function resetTimer() { gameStartTime = Date.now(); timerRunning = true; pausedElapsed = 0; updateTimerUI(); showToast("Spielzeit zurückgesetzt"); }
        function pauseTimer() {
            if (timerRunning) { pausedElapsed = Date.now() - gameStartTime; timerRunning = false; document.getElementById('timerPauseCompactBtn').innerText = "Start"; }
            else { gameStartTime = Date.now() - pausedElapsed; timerRunning = true; document.getElementById('timerPauseCompactBtn').innerText = "Pause"; startTimerInterval(); }
            updateTimerUI();
        }
        document.getElementById('timerResetCompactBtn').onclick = resetTimer;
        document.getElementById('timerPauseCompactBtn').onclick = pauseTimer;

        function getCurrentKehreNum() {
            if (overallWinner) return anzahlKehren;
            for (let i=0; i<anzahlKehren; i++) if (teamAPunkte[i]===0 && teamBPunkte[i]===0) return i+1;
            return anzahlKehren;
        }
        
        // Hauptfunktion: Aktualisiert alle Anzeigen (Steuerung + Zuschauer-Fenster)
        function updateAllDisplays() {
            const sumA = sum(teamAPunkte), sumB = sum(teamBPunkte);
            const current = getCurrentKehreNum();
            const winnerMsg = overallWinner ? (gamesWonA >= requiredGamesToWin ? teamAName : teamBName) : null;
            
            // Steuerungs-UI aktualisieren
            centerRoundA.innerText = sumA; centerRoundB.innerText = sumB;
            centerGamesA.innerText = gamesWonA; centerGamesB.innerText = gamesWonB;
            stampA.innerText = (gamesWonA >= requiredGamesToWin) ? '🏆 GESAMTSIEGER' : '';
            stampB.innerText = (gamesWonB >= requiredGamesToWin) ? '🏆 GESAMTSIEGER' : '';
            currentKehreSpan.innerText = overallWinner ? "🏆" : current;
            
            if (overallWinner) {
                globalWinnerMsgDiv.innerHTML = `<div style="background:#ffecb3; border-radius:60px; padding:8px;">🏆🏆🏆 ${winnerMsg} GESAMTSIEGER (${requiredGamesToWin} Siege) 🏆🏆🏆</div>`;
                document.body.classList.add('game-finished');
            } else {
                globalWinnerMsgDiv.innerHTML = '';
                document.body.classList.remove('game-finished');
            }
            
            // Farben für Kehren in Steuerung
            const leftRows = document.querySelectorAll('#leftKehrenPanel .kehre-row');
            const rightRows = document.querySelectorAll('#rightKehrenPanel .kehre-row');
            for (let i=0; i<leftRows.length; i++) {
                leftRows[i].classList.remove('current-kehre-bg','played-kehre-bg');
                rightRows[i].classList.remove('current-kehre-bg','played-kehre-bg');
                if (!overallWinner) {
                    if (i+1 === current) { leftRows[i].classList.add('current-kehre-bg'); rightRows[i].classList.add('current-kehre-bg'); }
                    else if (i+1 < current) { leftRows[i].classList.add('played-kehre-bg'); rightRows[i].classList.add('played-kehre-bg'); }
                }
            }
            
            // Zuschauer-Fenster aktualisieren (wenn offen)
            if (spectatorWindow && !spectatorWindow.closed) {
                try {
                    spectatorWindow.updateSpectatorData({
                        teamA: teamAName,
                        teamB: teamBName,
                        sumA: sumA,
                        sumB: sumB,
                        gamesA: gamesWonA,
                        gamesB: gamesWonB,
                        currentKehre: overallWinner ? "🏆" : current,
                        overallWinner: overallWinner,
                        winnerName: winnerMsg,
                        required: requiredGamesToWin
                    });
                    // Timer wird bereits über updateTimerUI synchronisiert
                } catch(e) { console.warn("Zuschauer-Fenster nicht erreichbar"); }
            }
        }
        
        function speakText(text) { if(speechEnabled && window.speechSynthesis) { try{ window.speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=0.9; window.speechSynthesis.speak(u); }catch(e){} } }
        function showToast(msg) { let t=document.getElementById('dynamicToast'); if(!t){ t=document.createElement('div'); t.id='dynamicToast'; t.className='toast-msg'; document.body.appendChild(t); } t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); }
        
        function setPoints(team, kehreIdx, punkte) {
            if (overallWinner) { showToast("Spiel beendet"); return; }
            if (punkte>=1 && punkte<=4) {
                if (team==='A') teamAPunkte[kehreIdx]=punkte;
                else teamBPunkte[kehreIdx]=punkte;
                speakText(`${team==='A'?teamAName:teamBName} Kehre ${kehreIdx+1} ${punkte} Punkt${punkte!==1?'e':''}`);
                renderFullPanels();
                updateAllDisplays();
                let allFilled = teamAPunkte.every((v,i)=> v!==0 || teamBPunkte[i]!==0);
                if (allFilled && !overallWinner) showToast(`Alle ${anzahlKehren} Kehren gespielt! Jetzt auswerten.`, 2500);
            }
        }
        function deleteKehre(team, idx) { if(overallWinner) return; if(team==='A') teamAPunkte[idx]=0; else teamBPunkte[idx]=0; renderFullPanels(); updateAllDisplays(); showToast(`Kehre ${idx+1} gelöscht`); }
        
        function awardGame(winner) {
            if(overallWinner) return;
            if(winner==='A') gamesWonA++; else gamesWonB++;
            updateAllDisplays();
            if(gamesWonA >= requiredGamesToWin || gamesWonB >= requiredGamesToWin) {
                overallWinner = true;
                speakText(`${winner==='A'?teamAName:teamBName} hat ${requiredGamesToWin} Spiele gewonnen und ist Gesamtsieger.`);
                updateAllDisplays();
                return;
            }
            for(let i=0;i<anzahlKehren;i++) { teamAPunkte[i]=0; teamBPunkte[i]=0; }
            renderFullPanels();
            updateAllDisplays();
            speakText(`Neue Runde beginnt mit Kehre 1.`);
        }
        
        function autoEvaluate() {
            if(overallWinner) { showToast("Spiel vorbei"); return; }
            const sumA = sum(teamAPunkte), sumB = sum(teamBPunkte);
            const allFilled = teamAPunkte.every((v,i)=> v!==0 || teamBPunkte[i]!==0);
            if(!allFilled && sumA===0 && sumB===0) { showToast("Keine Punkte"); return; }
            if(!allFilled) { showToast(`Nicht alle ${anzahlKehren} Kehren gespielt!`); return; }
            if(sumA === sumB) {
                if(confirm(`Unentschieden (${sumA}:${sumB}). Wer gewinnt das Spiel?`)) {
                    let winner = confirm(`Möchte ${teamAName} gewinnen? OK = ${teamAName}, Abbrechen = ${teamBName}`) ? 'A' : 'B';
                    awardGame(winner);
                }
            } else {
                const winner = sumA > sumB ? 'A' : 'B';
                if(confirm(`${winner==='A'?teamAName:teamBName} gewinnt (${sumA}:${sumB}). Bestätigen?`)) awardGame(winner);
            }
        }
        
        function resetRound() { if(overallWinner) { showToast("Spiel beendet"); return; } for(let i=0;i<anzahlKehren;i++){ teamAPunkte[i]=0; teamBPunkte[i]=0; } renderFullPanels(); updateAllDisplays(); showToast("Runde gelöscht"); speakText("Runde gelöscht"); }
        function newGame() { if(confirm("Komplettreset?")) { for(let i=0;i<anzahlKehren;i++){ teamAPunkte[i]=0; teamBPunkte[i]=0; } gamesWonA=0; gamesWonB=0; overallWinner=false; resetTimer(); renderFullPanels(); updateAllDisplays(); showToast("Neues Spiel"); speakText("Neues Spiel"); } }
        function resetScoresOnly() { if(confirm("Nur Siege zurücksetzen?")) { gamesWonA=0; gamesWonB=0; overallWinner=false; updateAllDisplays(); showToast("Siege zurückgesetzt"); } }
        
        function changeKehrenAnzahl(neu) {
            let neueA = new Array(neu).fill(0), neueB = new Array(neu).fill(0);
            for(let i=0;i<Math.min(teamAPunkte.length,neu);i++) { neueA[i]=teamAPunkte[i]; neueB[i]=teamBPunkte[i]; }
            teamAPunkte = neueA; teamBPunkte = neueB; anzahlKehren = neu;
            renderFullPanels(); updateAllDisplays(); showToast(`Kehren: ${neu}`);
        }
        
        function renderFullPanels() {
            const leftPanel = document.getElementById('leftKehrenPanel');
            leftPanel.innerHTML = '';
            for(let i=0;i<anzahlKehren;i++) {
                let row = document.createElement('div'); row.className='kehre-row';
                row.innerHTML = `<div class="kehre-nr">${i+1}</div><div class="punkte-group"><button class="side-punkt" data-val="1">1</button><button class="side-punkt" data-val="2">2</button><button class="side-punkt" data-val="3">3</button><button class="side-punkt" data-val="4">4</button><span class="side-value">${teamAPunkte[i]||0}</span><button class="side-del">🗑️</button></div>`;
                row.querySelectorAll('.side-punkt').forEach(btn=>btn.addEventListener('click',()=>setPoints('A',i,parseInt(btn.dataset.val))));
                row.querySelector('.side-del').addEventListener('click',()=>deleteKehre('A',i));
                leftPanel.appendChild(row);
            }
            const rightPanel = document.getElementById('rightKehrenPanel');
            rightPanel.innerHTML = '';
            for(let i=0;i<anzahlKehren;i++) {
                let row = document.createElement('div'); row.className='kehre-row';
                row.innerHTML = `<div class="kehre-nr">${i+1}</div><div class="punkte-group"><button class="side-punkt" data-val="1">1</button><button class="side-punkt" data-val="2">2</button><button class="side-punkt" data-val="3">3</button><button class="side-punkt" data-val="4">4</button><span class="side-value">${teamBPunkte[i]||0}</span><button class="side-del">🗑️</button></div>`;
                row.querySelectorAll('.side-punkt').forEach(btn=>btn.addEventListener('click',()=>setPoints('B',i,parseInt(btn.dataset.val))));
                row.querySelector('.side-del').addEventListener('click',()=>deleteKehre('B',i));
                rightPanel.appendChild(row);
            }
            document.getElementById('leftTeamName').innerHTML = teamAName;
            document.getElementById('rightTeamName').innerHTML = teamBName;
            centerTeamA.innerText = teamAName; centerTeamB.innerText = teamBName;
            updateAllDisplays();
        }
        
        function setRequiredGames(target) {
            requiredGamesToWin = target;
            document.querySelectorAll('.win-option-btn').forEach(btn=>{
                if(parseInt(btn.dataset.target)===target) btn.classList.add('active-win-option');
                else btn.classList.remove('active-win-option');
            });
            showToast(`Gesamtsieg bei ${target} Siegen`);
            if(!overallWinner) updateAllDisplays();
            else if(!(gamesWonA>=target || gamesWonB>=target)) { overallWinner=false; updateAllDisplays(); }
        }
        
        // Zuschauer-Fenster öffnen (NEU: separates Fenster, Steuerung bleibt aktiv)
        function openSpectatorWindow() {
            // Falls schon offen, Fenster in den Fokus bringen
            if (spectatorWindow && !spectatorWindow.closed) {
                spectatorWindow.focus();
                return;
            }
            // HTML-Code für das Zuschauer-Fenster (komplett eigenständig)
            const spectatorHTML = `<!DOCTYPE html>
            <html lang="de">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>ESV Grein · Zuschauer-Monitor</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        background: linear-gradient(145deg, #0f2e1a 0%, #091f0e 100%);
                        min-height: 100vh;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-family: 'Segoe UI', system-ui;
                        padding: 20px;
                    }
                    .spectator-card {
                        max-width: 1200px;
                        width: 95%;
                        background: #fefcf5;
                        border-radius: 80px;
                        padding: 40px 50px;
                        box-shadow: 0 30px 50px rgba(0,0,0,0.4);
                        text-align: center;
                    }
                    .spectator-header {
                        font-size: 2rem;
                        font-weight: 800;
                        color: #1b4d1b;
                        margin-bottom: 30px;
                        background: #eef5e9;
                        display: inline-block;
                        padding: 8px 40px;
                        border-radius: 80px;
                    }
                    .spectator-teams {
                        display: flex;
                        gap: 50px;
                        justify-content: center;
                        margin: 30px 0;
                        flex-wrap: wrap;
                    }
                    .spectator-team {
                        flex: 1;
                        min-width: 250px;
                        background: #fafef5;
                        border-radius: 60px;
                        padding: 30px 20px;
                        border-bottom: 8px solid;
                    }
                    .spectator-team-name {
                        font-size: 2.5rem;
                        font-weight: 900;
                        margin-bottom: 20px;
                    }
                    .spectator-kehren-summe {
                        font-size: 6rem;
                        font-weight: 900;
                        background: #ecf7e5;
                        border-radius: 80px;
                        padding: 20px;
                        margin: 20px 0;
                    }
                    .spectator-games {
                        font-size: 1.5rem;
                        background: #e9f2e2;
                        border-radius: 60px;
                        padding: 15px;
                    }
                    .spectator-games-number {
                        font-size: 3rem;
                        font-weight: 800;
                        background: #1b4d1b;
                        color: white;
                        display: inline-block;
                        padding: 8px 30px;
                        border-radius: 70px;
                        margin-top: 10px;
                    }
                    .spectator-kehre {
                        margin-top: 30px;
                        font-size: 1.8rem;
                        background: #eef3e4;
                        display: inline-block;
                        padding: 15px 40px;
                        border-radius: 80px;
                    }
                    .spectator-timer {
                        margin-top: 20px;
                        font-size: 2rem;
                        font-family: monospace;
                        background: #1e2a1e;
                        color: #f5ffd3;
                        display: inline-block;
                        padding: 10px 35px;
                        border-radius: 70px;
                    }
                    .winner-msg {
                        margin-top: 20px;
                        font-weight: bold;
                        font-size: 1.5rem;
                        background: #ffecb3;
                        display: inline-block;
                        padding: 10px 30px;
                        border-radius: 60px;
                    }
                    @media (max-width: 700px) {
                        .spectator-card { padding: 20px; }
                        .spectator-team-name { font-size: 1.5rem; }
                        .spectator-kehren-summe { font-size: 3rem; }
                    }
                </style>
            </head>
            <body>
                <div class="spectator-card">
                    <div class="spectator-header">🥌 ESV Grein 🥌</div>
                    <div class="spectator-teams">
                        <div class="spectator-team" style="border-bottom-color: #2c7a4d;">
                            <div class="spectator-team-name" id="specTeamA">Mannschaft W</div>
                            <div class="spectator-kehren-summe" id="specSumA">0</div>
                            <div class="spectator-games">🏆 Spiele gewonnen<br><span class="spectator-games-number" id="specGamesA">0</span></div>
                        </div>
                        <div class="spectator-team" style="border-bottom-color: #c0392b;">
                            <div class="spectator-team-name" id="specTeamB">Mannschaft E</div>
                            <div class="spectator-kehren-summe" id="specSumB">0</div>
                            <div class="spectator-games">🏆 Spiele gewonnen<br><span class="spectator-games-number" id="specGamesB">0</span></div>
                        </div>
                    </div>
                    <div class="spectator-kehre" id="specKehre">Aktuelle Kehre: 1</div>
                    <div class="spectator-timer" id="specTimer">00:00:00</div>
                    <div id="specWinnerMsg" class="winner-msg" style="display: none;"></div>
                </div>
                <script>
                    // Funktionen, die vom Hauptfenster aufgerufen werden
                    window.updateSpectatorData = function(data) {
                        document.getElementById('specTeamA').innerText = data.teamA;
                        document.getElementById('specTeamB').innerText = data.teamB;
                        document.getElementById('specSumA').innerText = data.sumA;
                        document.getElementById('specSumB').innerText = data.sumB;
                        document.getElementById('specGamesA').innerText = data.gamesA;
                        document.getElementById('specGamesB').innerText = data.gamesB;
                        document.getElementById('specKehre').innerHTML = data.overallWinner ? "🏆 SPIEL BEENDET 🏆" : "Aktuelle Kehre: " + data.currentKehre;
                        if (data.overallWinner && data.winnerName) {
                            const winnerDiv = document.getElementById('specWinnerMsg');
                            winnerDiv.innerText = "🏆🏆🏆 " + data.winnerName + " GESAMTSIEGER (" + data.required + " Siege) 🏆🏆🏆";
                            winnerDiv.style.display = "inline-block";
                        } else {
                            document.getElementById('specWinnerMsg').style.display = "none";
                        }
                    };
                    window.updateSpectatorTimer = function(timeStr) {
                        document.getElementById('specTimer').innerText = timeStr;
                    };
                <\/script>
            </body>
            </html>`;
            
            // Neues Fenster öffnen
            spectatorWindow = window.open("", "SpectatorMonitor", "width=1280,height=720,resizable=yes,scrollbars=yes");
            if (spectatorWindow) {
                spectatorWindow.document.write(spectatorHTML);
                spectatorWindow.document.close();
                // Initiale Daten senden
                setTimeout(() => {
                    if (spectatorWindow && !spectatorWindow.closed) {
                        const sumA = sum(teamAPunkte), sumB = sum(teamBPunkte);
                        spectatorWindow.updateSpectatorData({
                            teamA: teamAName,
                            teamB: teamBName,
                            sumA: sumA,
                            sumB: sumB,
                            gamesA: gamesWonA,
                            gamesB: gamesWonB,
                            currentKehre: overallWinner ? "🏆" : getCurrentKehreNum(),
                            overallWinner: overallWinner,
                            winnerName: overallWinner ? (gamesWonA >= requiredGamesToWin ? teamAName : teamBName) : null,
                            required: requiredGamesToWin
                        });
                        updateTimerUI(); // Timer wird ebenfalls synchronisiert
                    }
                }, 100);
            } else {
                alert("Bitte erlauben Sie Pop-up-Fenster für diesen Button, damit der Zuschauer-Monitor geöffnet werden kann.");
            }
        }
        
        // Event Bindings
        document.getElementById('applyKehrenSide').onclick = () => { let neu = parseInt(document.getElementById('kehrenSelectSide').value); if(neu !== anzahlKehren && confirm(`Kehren auf ${neu} ändern?`)) changeKehrenAnzahl(neu); };
        document.getElementById('teamANameSide').oninput = (e) => { teamAName = e.target.value.trim()||"Team A"; renderFullPanels(); };
        document.getElementById('teamBNameSide').oninput = (e) => { teamBName = e.target.value.trim()||"Team B"; renderFullPanels(); };
        document.getElementById('speechToggleSide').onchange = (e) => speechEnabled = e.target.checked;
        document.getElementById('winGameBtn').onclick = autoEvaluate;
        document.getElementById('autoEvaluateGameBtn').onclick = autoEvaluate;
        document.getElementById('resetRoundBtn').onclick = resetRound;
        document.getElementById('newGameBtn').onclick = newGame;
        document.getElementById('resetTotalBtn').onclick = resetScoresOnly;
        document.getElementById('printPDFBtn').onclick = () => window.print();
        document.getElementById('openSpectatorBtn').onclick = openSpectatorWindow;
        document.querySelectorAll('.win-option-btn').forEach(btn=>btn.addEventListener('click',()=>setRequiredGames(parseInt(btn.dataset.target))));
        
        function init() {
            anzahlKehren=6; teamAPunkte=new Array(6).fill(0); teamBPunkte=new Array(6).fill(0);
            gamesWonA=0; gamesWonB=0; overallWinner=false; requiredGamesToWin=2;
            teamAName="Mannschaft W"; teamBName="Mannschaft E";
            document.getElementById('teamANameSide').value=teamAName; document.getElementById('teamBNameSide').value=teamBName;
            renderFullPanels(); initTimer();
        }
        init();
    </script>
</body>
</html>
